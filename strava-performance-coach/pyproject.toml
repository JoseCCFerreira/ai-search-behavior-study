[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-performance-coach"
version = "0.1.0"
description = "Personal Strava performance analysis and coaching application"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "strava",
    "performance",
    "analytics",
    "coach",
    "training",
    "running",
    "cycling"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "requests==2.31.0",
    "httpx==0.25.2",
    "pandas==2.1.4",
    "duckdb==0.9.2",
    "fitparse==1.2.0",
    "plotly==5.18.0",
    "streamlit==1.28.1",
    "scikit-learn==1.3.2",
    "python-dateutil==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "flake8==6.1.0",
    "isort==5.13.2",
    "mypy==1.7.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/strava-performance-coach"
Documentation = "https://github.com/yourusername/strava-performance-coach/tree/main/docs"
Repository = "https://github.com/yourusername/strava-performance-coach.git"
Issues = "https://github.com/yourusername/strava-performance-coach/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
